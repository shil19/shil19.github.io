function showTable(data){

    let html = "<table>";

    data.forEach((row,index)=>{

        html += "<tr>";

        row.forEach(cell=>{

            if(index==0){
                html += "<th>" + cell + "</th>";
            }
            else{
                html += "<td>" + cell + "</td>";
            }

        });

        html += "</tr>";

    });


    html += "</table>";

    document.getElementById("result").innerHTML = html;

}

function showUl(data) {

    const html = data
        .slice()
        .reverse()
        .map(row => `
            <li>
                <a href="${row[1]}" target="_blank" rel="noopener">
                    ${row[0]}
                </a>
            </li>
        `)
        .join("");

    document.getElementById("result").innerHTML =
        `<div class="file-list"><ul>${html}</ul></div>`;
}
