

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
body {
    text-align: center;
}
table {
    display: flex;
    flex-direction: row;
    width: max-content;
    overflow-x: auto;
    margin: 0 auto;
}

tbody {
    display: flex;
    flex-direction: row;
}

tr {
    display: flex;
    flex-direction: column;
    flex: 0 0 120px;
}

th, td {
    display: flex;
    width: 120px;
    height: 45px;
    box-sizing: border-box;
    border: 1px solid #999;
    align-items: center;
    justify-content: center;
}

th {
    background: #4CAF50;
    color: white;
}
</style>
</head>
<body>

<h2>學生資料表</h2>

<table>
<tbody>
<tr>
<th>學號</th>
<th>姓名</th>
<th>性別</th>
<th>年齡</th>
</tr>

<tr>
<td>001</td>
<td>王小明</td>
<td>男</td>
<td>18</td>
</tr>

<tr>
<td>002</td>
<td>陳小華</td>
<td>女</td>
<td>19</td>
</tr>

<tr>
<td>003</td>
<td>林大偉</td>
<td>男</td>
<td>20</td>
</tr>
</tbody>
</table>

</body>
</html>
