function showTable(data){

    let html = "<table>";

    data.forEach((row,index)=>{

        html += "<tr>";

        row.forEach(cell=>{

            if(index==0){
                html += "<th>" + cell + "</th>";
            }
            else{
                html += "<td>" + formatNumber(cell) + "</td>";
            }

        });

        html += "</tr>";

    });


    html += "</table>";

    document.getElementById("result").innerHTML = html;

}
  //取小數第二位 Number().toFixed(2) 或 function formatNumber(val)
  //
function formatNumber(val) {
  const num = Number(val);
  // 若不是有效數字（例如文字或空值），直接回傳原值
  if (isNaN(num) || val === "" || val === null) return val;
  
  // 如果是整數，直接回傳；有小數點則四捨五入到小數第二位（不補多餘的 0）
  return Number.isInteger(num) ? num : Math.round(num * 100) / 100;
}

function showUl(data) {

    const html = data
        .slice()
        .reverse()
        .map(row => `
            <li>
                <a href="${row[1]}" target="_blank" rel="noopener">
                    ${row[0]}
                </a>
            </li>
        `)
        .join("");

    document.getElementById("result").innerHTML =
        `<div class="file-list"><ul>${html}</ul></div>`;
}

// 當在第一個輸入框按下 Enter
document.getElementById("keyword").addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault(); // 防止表單意外送出或換行
        document.getElementById("passwd").focus(); // 游標跳至 id 為 passwd 的輸入框
    }
});

// 當在第二個輸入框按下 Enter，才執行搜尋
document.getElementById("passwd").addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault(); // 建議補上這行，避免表單意外重整網頁
        document.getElementById("query").focus(); /// 游標跳至 id 為 query 的
        search();
    }
});
