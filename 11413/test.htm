<style>
/* 讓表格啟動彈性佈局 */
table {
  display: flex;
  flex-direction: row; /* 讓每一列 (tr) 橫向並排 */
  overflow-x: auto;    /* 如果資料太多，自動啟動橫向滾動條 */
}

/* 讓 tr 變成直向排列 */
table tr {
  display: flex;
  flex-direction: column; /* 讓儲存格 (th, td) 在 tr 內由上往下排 */
  flex-shrink: 0;         /* 防止欄寬被擠壓變形 */
}

/* 調整標題與資料格的寬度與對齊 */
table th, table td {
  display: block;        /* 區塊化以利控制寬高 */
  width: 120px;          /* 統一直向每欄的寬度 (可自由調整) */
  box-sizing: border-box;
}
</style>

<table>
<tr><th>中文</th><th>中文2</th><th>中文3</th></tr>
<tr><td>1</td><td>2</td><td>3</td></tr>
</table>


以下是一個簡單的 HTML 網頁表格範例，可以直接複製使用。

1. 基本 HTML 表格

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>網頁表格範例</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>學生資料表</h2>

<table>
    <tr>
        <th>學號</th>
        <th>姓名</th>
        <th>性別</th>
        <th>年齡</th>
    </tr>
    <tr>
        <td>001</td>
        <td>王小明</td>
        <td>男</td>
        <td>18</td>
    </tr>
    <tr>
        <td>002</td>
        <td>陳小華</td>
        <td>女</td>
        <td>19</td>
    </tr>
    <tr>
        <td>003</td>
        <td>林大偉</td>
        <td>男</td>
        <td>20</td>
    </tr>
</table>
