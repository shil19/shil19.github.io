  <body>


<h2>提供給家長的檔案清單</h2>

<div id="result">
讀取中...
</div>


<script>

const url =
"https://script.google.com/a/macros/scjh.kh.edu.tw/s/AKfycbx-vj-k0emXu0pAHjDlHYVhmtx6efngrFYBgItK9OAK4XEZ_XGIxuCg4CR2a2KaxE4o/exec?sheet=一下三段";
//const url =
//"https://script.google.com/a/macros/scjh.kh.edu.tw/s/AKfycbx-vj-k0emXu0pAHjDlHYVhmtx6efngrFYBgItK9OAK4XEZ_XGIxuCg4CR2a2KaxE4o/exec?sheet=工作表1";


fetch(url)
.then(response => response.json())
.then(data => {

    console.log(data);

    showTable(data);

})
.catch(error => {
    console.error(error);
});


function showTable(data){

    let html = "<table>";

    data.forEach((row,index)=>{

        html += "<tr>";

        row.forEach(cell=>{

            if(index==0){
                html += "<th>" + cell + "</th>";
            }
            else{
                html += "<td>" + cell + "</td>";
            }

        });

        html += "</tr>";

    });


    html += "</table>";

    document.getElementById("result").innerHTML = html;

}

</script>
